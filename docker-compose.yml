version: "3.9"

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolov26-dashboard
    env_file:
      - .env
    ports:
      - "${YOLOV26_DASHBOARD_PORT:-5000}:${YOLOV26_DASHBOARD_PORT:-5000}"
    volumes:
      - ./:/app
    restart: unless-stopped
