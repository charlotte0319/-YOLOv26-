# pyproject.toml
# Purpose: centralize build, lint, and pytest configuration.
# Used by: pip/build, ruff, and pytest.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".venv",
  "data",
  "runs_yolo26n",
  "runs_yolo26x",
  "model",
  "model_fusion",
  "legacy_physics_stockout",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q -ra"
testpaths = ["tests"]
